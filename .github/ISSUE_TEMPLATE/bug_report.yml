name: 问题反馈 / Bug report
description: 备注不显示、显示位置不对、功能出错等 / Notes not showing, misplaced, or something broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量写清楚在哪个页面、做了什么、看到了什么。
        Thanks for reporting! Please describe the page, what you did, and what you saw.

        > 请不要粘贴备注中的隐私内容。/ Please don't paste private note contents.
  - type: input
    id: version
    attributes:
      label: 扩展版本 / Extension version
      description: 从扩展面板底部的「反馈问题」进入时会自动填写 / Filled in automatically when opened from the panel
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本 / Browser and version
      placeholder: "Edge 141 / Firefox 143"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 出现问题的 GitHub 页面 / GitHub page where it happens
      description: 例如某个 issue、用户主页、followers 列表 / e.g. an issue, a profile, a followers list
      placeholder: "https://github.com/owner/repo/issues/1"
  - type: textarea
    id: what
    attributes:
      label: 问题描述 / What happened
      description: 实际看到了什么？可以附截图 / What did you see? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 … / Open …
        2. 点击 … / Click …
        3. 看到 … / See …
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected behavior
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checks
      options:
        - label: 我已搜索过现有 issue，没有重复 / I searched existing issues and this is not a duplicate
          required: true
        - label: 我已在扩展管理页「重新加载」并刷新 GitHub 页面后重试 / I reloaded the extension and refreshed the GitHub page
